variables:
  IMAGE_TAG: "0.5.4"

include:
  - project: "dev/commun/templates"
    ref: 'v3'
    file: 
      - "templates/docker-push.yml"
      - "templates/docker-build.yml"
      - "templates/trivy-scan-image.yml"

stages:
  - test
  - docker-build-save
  - trivy-scan-image
  - docker-build-push

# ---

test:
  stage: test
  when: manual
  allow_failure: true
  image: neufhs-docker-stages.${REPOSITOI_LOCAL_ZONE_HOSTNAME}/golang:1.26.3-enedis-1
  variables:
    GOPROXY: "https://${REPOSITOI_LOCAL_ZONE_HOSTNAME}/artifactory/remote-go-proxy-golang"
    GONOSUMDB: "*"
  script:
    - go test -v -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
    - go tool cover -html=coverage.out -o coverage.html
  coverage: '/total:\s+\(statements\)\s+(\d+\.?\d+)%/'
  artifacts:
    when: always
    paths:
      - coverage.out
      - coverage.html
    expire_in: 1 week

# ---

docker-build-save:
  extends: .docker-build-save
  stage: docker-build-save
  variables:
    CONTAINER_REGISTRY_URL: neufhs-docker-stages.${REPOSITOI_LOCAL_ZONE_HOSTNAME}
    IMAGE_NAME: gitlab-mr-conform
    IMAGE_TAG: 0.5.3
    IMAGE_TARBALL_NAME: gitlab-mr-conform
    DOCKER_COMPLEMENTARY_OPTIONS: >-
      --build-arg REPOSITOI_LOCAL_ZONE_HOSTNAME=${REPOSITOI_LOCAL_ZONE_HOSTNAME}
      --build-arg PLACIDE_STAGES_DOCKER_REPO=${PLACIDE_STAGES_DOCKER_REPO}
    ARTIFACTS_EXPIRE_IN: "5 mins"

trivy-scan-image:
  stage: trivy-scan-image
  extends: 
    - .trivy-scan-image
  variables:
    TRIVY_VIOLATIONS_SEVERITY_LEVEL: "HIGH"
    TRIVY_OPTIONS: "--severity HIGH,CRITICAL --show-suppressed"
    IMAGE_TAG: 0.5.3
    IMAGE_TARBALL_NAME: gitlab-mr-conform

docker-build-push:
  extends: .docker-build-push
  stage: docker-build-push
  variables:
    CONTAINER_REGISTRY_URL: neufhs-docker-stages.repositoi.zca.enedis.fr
    IMAGE_NAME: gitlab-mr-conform
    IMAGE_TAG: 0.5.3
    USE_BUILDKIT_CACHE: 'true'
    DOCKER_COMPLEMENTARY_OPTIONS: >-
      --build-arg REPOSITOI_LOCAL_ZONE_HOSTNAME=${REPOSITOI_ZCA_HOSTNAME}
      --build-arg PLACIDE_STAGES_DOCKER_REPO=${PLACIDE_STAGES_DOCKER_REPO}
